<svg width="220" height="46" viewBox="0 0 220 46" xmlns="http://www.w3.org/2000/svg" font-family="'Open Sans', Helvetica, Arial, sans-serif">

  <!-- Weill Cornell Imaging -->
  <text x="0" y="19" font-size="19" font-weight="700" letter-spacing="-0.4" fill="#cbd5e1">Weill Cornell Imaging</text>

  <!-- NYP icon: two horizontal bars with vertical left bar -->
  <rect x="1"  y="29" width="2.5" height="14" fill="#e03131"/>
  <rect x="1"  y="29" width="11"  height="3"  fill="#e03131"/>
  <rect x="1"  y="40" width="11"  height="3"  fill="#e03131"/>

  <!-- New York-Presbyterian -->
  <text x="16" y="39" font-size="10" font-weight="600" fill="#e03131" letter-spacing="0.01em">New York-Presbyterian</text>

  <!-- Divider dot -->
  <circle cx="122" cy="35" r="1.5" fill="#6b7280"/>

  <!-- Cornell crest simplified circle -->
  <circle cx="132" cy="35" r="5.5" fill="none" stroke="#9b1212" stroke-width="1.2"/>
  <text x="128.5" y="37.5" font-size="4.5" font-weight="700" fill="#9b1212">WCM</text>

  <!-- Weill Cornell -->
  <text x="141" y="39" font-size="10" font-weight="600" fill="#9b1212" letter-spacing="0.01em">Weill Cornell </text>
  <!-- Medicine in orange -->
  <text x="193" y="39" font-size="10" font-weight="700" fill="#e7751d" letter-spacing="0.01em">Medicine</text>

</svg>
